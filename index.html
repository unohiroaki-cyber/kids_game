<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲームをえらぶ</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 30px 16px 48px;
        background-color: #0b1a24;
        background-image: radial-gradient(120% 80% at 50% 0%, #17394e 0%, #0b1a24 62%);
        color: #e6f2f8;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 26px; }
    h1 {
        font-size: 34px;
        margin: 0 0 8px;
        letter-spacing: 0.05em;
    }
    .lead { margin: 0; color: #8aafc2; font-size: 15px; }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
    }
    .card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px;
        border-radius: 18px;
        background-color: #152c3b;
        border: 1px solid rgba(143, 208, 232, 0.18);
        text-decoration: none;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .card:active {
        transform: scale(0.97);
        background-color: #1e3c4f;
    }
    .badge {
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.06);
    }
    .name {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 5px;
    }
    .desc {
        font-size: 13px;
        color: #8aafc2;
        margin: 0;
        line-height: 1.6;
    }
    footer {
        margin-top: 34px;
        text-align: center;
        color: #4f7488;
        font-size: 12px;
    }
</style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>ゲームをえらぶ</h1>
        <p class="lead">あそびたいものを タップしてね</p>
    </header>

    <div class="grid" id="grid"></div>

    <footer>あたらしいゲームは ここに ふえていきます</footer>
</div>

<script>
    const games = [
        {
            file: "meiro.html",
            name: "めいろゲーム",
            desc: "たまを ぜんぶ あつめて、おにから にげよう",
            color: "#5fc7f0",
            icon: `<svg viewBox="0 0 48 48" width="40" height="40" fill="none">
                     <rect x="5" y="5" width="38" height="38" rx="7" stroke="currentColor" stroke-width="4"/>
                     <rect x="14" y="14" width="8" height="8" rx="2" fill="currentColor"/>
                     <rect x="26" y="26" width="8" height="8" rx="2" fill="currentColor"/>
                     <circle cx="31" cy="17" r="3" fill="currentColor"/>
                     <circle cx="17" cy="31" r="3" fill="currentColor"/>
                   </svg>`
        },
        {
            file: "batta.html",
            name: "バモジャンプ",
            desc: "いしと むしを ジャンプで よけよう。手が きたら ジャンプきんし！",
            color: "#8ede62",
            icon: `<svg viewBox="0 0 48 48" width="40" height="40" fill="none">
                     <path d="M6 38 Q17 12 29 30" stroke="currentColor" stroke-width="3"
                           stroke-dasharray="3 6" stroke-linecap="round"/>
                     <ellipse cx="31" cy="32" rx="11" ry="6.5" fill="currentColor"/>
                     <circle cx="41" cy="28" r="4.5" fill="currentColor"/>
                     <path d="M25 33 L18 26" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                     <path d="M43 23 L47 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                   </svg>`
        }
    ];

    let html = "";

    for (let i = 0; i < games.length; i++) {
        const g = games[i];
        html = html + `
            <a class="card" href="${g.file}">
                <div class="badge" style="color: ${g.color}">${g.icon}</div>
                <div>
                    <p class="name">${g.name}</p>
                    <p class="desc">${g.desc}</p>
                </div>
            </a>`;
    }

    document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
